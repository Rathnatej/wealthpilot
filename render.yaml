services:
  - type: web
    name: wealthpilot-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Optional: email alerts and payment reminders
      - key: CRON_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # Voice assistant (all optional; defaults shown in README)
      - key: VOICE_ENABLED
        value: "true"
      - key: VOICE_PAID_ONLY
        value: "false"
      - key: VOICE_ENCRYPTION_KEY
        sync: false
      - key: VOICE_PRO_EMAILS
        sync: false
